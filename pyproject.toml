[project]
name = "invoice-processor"
version = "0.1.0"
description = "Automation that reads PDF invoices from Gmail and exports them to Google Sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.57.0",
    "pypdfium2>=4.30.0",
    "google-auth>=2.37.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.160.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factura_processor"]

[tool.uv]
package = true

[project.scripts]
factura-processor = "factura_processor.__main__:main"
